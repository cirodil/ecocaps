version: "3.8"

services:
  database:
    image: postgres:15
    container_name: cap_database
    environment:
      POSTGRES_DB: cap_collection
      POSTGRES_USER: cap_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cap_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cap_backend
    environment:
      DATABASE_URL: postgresql://cap_user:${DB_PASSWORD}@database:5432/cap_collection
      HOST: 0.0.0.0
      PORT: "8000" # Внутренний порт в контейнере остается 8000
    ports:
      - "8001:8000" # Внешний порт меняем на 8001
    depends_on:
      - database
    networks:
      - cap_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cap_frontend
    environment:
      API_BASE_URL: http://backend:8000 # Внутри Docker сети остается 8000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - backend
    networks:
      - cap_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cap_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cap_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cap_network:
    driver: bridge
